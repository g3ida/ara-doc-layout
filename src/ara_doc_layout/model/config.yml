# PP-DocLayout_plus-L fine-tuned for Arabic pages: the model the checkpoint
# was trained as, and the way a page is prepared for it.
#
# This is the training config the checkpoint came from, with PaddleX's base
# config for PP-DocLayout_plus-L written in, and every section that only
# training reads — datasets, augmentation, optimiser, schedule — left out. The
# original named its base by a path into a PaddleX checkout and its datasets by
# paths relative to the training folder, so it ran only from there.
#
# The values that change what the model computes are the base's, unchanged,
# except the three the fine-tune set: `num_classes` (9, not the base's 20),
# `norm_type` (`bn`: `sync_bn` needs a process group) and the reader, which
# squeezes every page to 800×800 whatever its proportions.

architecture: DETR
num_classes: 9
norm_type: bn
hidden_dim: 256
use_focal_loss: True
eval_size: [800, 800]

DETR:
  backbone: PPHGNetV2
  neck: HybridEncoder
  transformer: RTDETRTransformer
  detr_head: DINOHead
  post_process: DETRPostProcess

PPHGNetV2:
  arch: 'L'
  return_idx: [1, 2, 3]
  freeze_stem_only: true
  freeze_at: 0
  freeze_norm: true
  lr_mult_list: [0., 0.05, 0.05, 0.05, 0.05]

HybridEncoder:
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  encoder_layer:
    name: TransformerLayer
    d_model: 256
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.
    activation: 'gelu'
  expansion: 1.0

RTDETRTransformer:
  num_queries: 300
  position_embed_type: sine
  feat_strides: [8, 16, 32]
  num_levels: 3
  nhead: 8
  num_decoder_layers: 6
  dim_feedforward: 1024
  dropout: 0.0
  activation: relu
  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0
  learnt_init_query: false

DINOHead:
  loss:
    name: DINOLoss
    loss_coeff: {class: 1, bbox: 5, giou: 2}
    aux_loss: true
    use_vfl: true
    matcher:
      name: HungarianMatcher
      matcher_coeff: {class: 2, bbox: 5, giou: 2}

DETRPostProcess:
  num_top_queries: 300

# `Decode` is the detector's own job (`PPDocLayout._sample`), so a page can be
# handed over already in memory; the rest runs as ppdet's operators.
TestReader:
  inputs_def:
    image_shape: [3, 800, 800]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [800, 800], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0., 0., 0.], std: [1., 1., 1.], norm_type: none}
    - Permute: {}
  batch_size: 1
